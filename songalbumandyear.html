<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Song Knowledge Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #ffffff;
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        audio::-webkit-media-controls-enclosure {
            border-radius: 4px;
            background-color: #f4f4f5;
        }
        
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #18181b;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .album-card:hover { background-color: #f8f8f8; }
        .track-item:hover { background-color: #fafafa; }
        
        .verify-btn:disabled { opacity: 0.5; cursor: wait; }
    </style>
</head>
<body class="text-zinc-900 selection:bg-zinc-200">

    <!-- Search View -->
    <div id="search-view" class="max-w-2xl mx-auto px-6 py-12 md:py-24">
        <header class="mb-12">
            <h1 class="text-3xl font-light tracking-tight mb-2">Song & Album Finder</h1>
            <p class="text-zinc-500 font-light italic text-sm">Cross-referencing Wikidata and Discogs at the song level.</p>
        </header>

        <div class="relative group">
            <input type="text" id="search-input" 
                placeholder="Search songs or albums..." 
                class="w-full bg-white border border-zinc-200 px-5 py-4 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-zinc-900/5 focus:border-zinc-400 transition-all text-lg font-light">
            <div id="search-loader" class="absolute right-5 top-1/2 -translate-y-1/2 hidden">
                <div class="loader"></div>
            </div>
        </div>

        <div id="results-grid" class="mt-12 grid grid-cols-1 gap-1">
            <!-- Results injected here -->
        </div>
    </div>

    <!-- Detail View -->
    <div id="detail-view" class="hidden fixed inset-0 bg-white z-50 overflow-y-auto">
        <div class="max-w-2xl mx-auto px-6 py-12">
            <button id="back-button" class="mb-8 p-2 -ml-2 text-zinc-400 hover:text-zinc-900 transition-colors flex items-center gap-2 font-light">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                <span>Back to Search</span>
            </button>

            <div id="album-header" class="mb-12 fade-in">
                <h2 id="detail-album-name" class="text-4xl font-light tracking-tight mb-2 italic text-zinc-800"></h2>
                <p id="detail-artist-name" class="text-xl text-zinc-400 font-light"></p>
            </div>

            <div id="tracks-container" class="space-y-1 fade-in" style="animation-delay: 0.1s;">
                <!-- Tracks injected here -->
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('search-input');
        const resultsGrid = document.getElementById('results-grid');
        const searchLoader = document.getElementById('search-loader');
        const searchView = document.getElementById('search-view');
        const detailView = document.getElementById('detail-view');
        const backButton = document.getElementById('back-button');

        let searchTimeout;

        searchInput.oninput = () => {
            clearTimeout(searchTimeout);
            const query = searchInput.value.trim();
            if (query.length < 2) {
                resultsGrid.innerHTML = '';
                return;
            }
            searchLoader.classList.remove('hidden');
            searchTimeout = setTimeout(() => searchMusic(query), 500);
        };

        async function searchMusic(query) {
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=album&limit=10`);
                const data = await response.json();
                renderResults(data.results);
            } catch (error) {
                console.error("Search error:", error);
            } finally {
                searchLoader.classList.add('hidden');
            }
        }

        function renderResults(albums) {
            resultsGrid.innerHTML = '';
            if (albums.length === 0) {
                resultsGrid.innerHTML = '<p class="text-zinc-400 font-light text-center py-12">No albums found.</p>';
                return;
            }

            albums.forEach(album => {
                const div = document.createElement('div');
                div.className = 'album-card group flex items-center justify-between p-4 rounded-xl cursor-pointer border border-transparent transition-all';
                div.innerHTML = `
                    <div class="flex-1">
                        <h3 class="font-medium text-zinc-800 group-hover:text-black">${album.collectionName}</h3>
                        <p class="text-sm text-zinc-500 font-light">${album.artistName}</p>
                    </div>
                    <div class="text-zinc-200 group-hover:text-zinc-400 transition-colors">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </div>
                `;
                div.onclick = () => showAlbumDetail(album);
                resultsGrid.appendChild(div);
            });
            lucide.createIcons();
        }

        async function verifySongData(songName, artistName, trackId) {
            const btn = document.querySelector(`[data-verify-id="${trackId}"]`);
            const statusText = document.querySelector(`[data-status-id="${trackId}"]`);
            
            btn.disabled = true;
            statusText.textContent = "Checking...";
            statusText.classList.remove('hidden');

            const results = { wiki: null, discogs: null };

            try {
                // 1. Wikidata Query
                const wikiSearch = await fetch(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(songName + ' ' + artistName)}&language=en&format=json&origin=*`);
                const wikiData = await wikiSearch.json();
                if (wikiData.search?.length > 0) {
                    const qid = wikiData.search[0].id;
                    const wikiClaims = await fetch(`https://www.wikidata.org/w/api.php?action=wbgetclaims&entity=${qid}&property=P577&format=json&origin=*`);
                    const claimData = await wikiClaims.json();
                    if (claimData.claims?.P577) {
                        results.wiki = claimData.claims.P577[0].mainsnak.datavalue.time.substring(1, 5);
                    }
                }

                // 2. Discogs Query (Public search, finding earliest release)
                // Note: Discogs API often requires a token for full features, 
                // but basic search is often accessible via standard fetch in some contexts or proxied.
                // We'll use a smart search string for original release.
                const discogsSearch = await fetch(`https://api.discogs.com/database/search?q=${encodeURIComponent(artistName + ' ' + songName)}&type=release&format=single|album&sort=year&sort_order=asc&per_page=1`, {
                    headers: { 'User-Agent': 'MusicKnowledgeFinder/1.0' }
                });
                const dData = await discogsSearch.json();
                if (dData.results?.length > 0) {
                    results.discogs = dData.results[0].year;
                }

                // Update UI
                let metaHtml = '';
                if (results.wiki) metaHtml += `<span class="bg-zinc-100 text-zinc-600 px-1.5 py-0.5 rounded mr-1">W: ${results.wiki}</span>`;
                if (results.discogs) metaHtml += `<span class="bg-zinc-100 text-zinc-600 px-1.5 py-0.5 rounded">D: ${results.discogs}</span>`;
                
                statusText.innerHTML = metaHtml || '<span class="text-zinc-300">Not found</span>';
                btn.classList.add('hidden');

            } catch (e) {
                statusText.textContent = "Error";
            } finally {
                btn.disabled = false;
            }
        }

        async function showAlbumDetail(album) {
            searchView.classList.add('hidden');
            detailView.classList.remove('hidden');
            window.scrollTo(0, 0);

            document.getElementById('detail-album-name').textContent = album.collectionName;
            document.getElementById('detail-artist-name').textContent = album.artistName;
            
            const tracksContainer = document.getElementById('tracks-container');
            tracksContainer.innerHTML = '<div class="flex justify-center py-12"><div class="loader"></div></div>';
            
            try {
                const response = await fetch(`https://itunes.apple.com/lookup?id=${album.collectionId}&entity=song`);
                const data = await response.json();
                renderTracks(data.results.filter(r => r.wrapperType === 'track'));
            } catch (error) {
                tracksContainer.innerHTML = '<p class="text-red-500 font-light text-center py-12">Failed to load tracks.</p>';
            }
        }

        function renderTracks(tracks) {
            const tracksContainer = document.getElementById('tracks-container');
            tracksContainer.innerHTML = '';

            tracks.forEach((track, index) => {
                const trackId = track.trackId || index;
                const div = document.createElement('div');
                div.className = 'track-item flex items-center gap-4 p-4 rounded-lg border border-transparent transition-all';
                div.innerHTML = `
                    <div class="w-6 text-xs font-light text-zinc-300">${track.trackNumber || index + 1}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-0.5">
                            <p class="text-sm font-medium text-zinc-800 truncate">${track.trackName}</p>
                            <span data-status-id="${trackId}" class="hidden text-[9px] font-bold uppercase tracking-wider"></span>
                        </div>
                        <p class="text-xs text-zinc-400 font-light truncate">${track.artistName}</p>
                    </div>
                    <div class="shrink-0 flex items-center gap-1">
                        <button class="verify-btn p-2 text-zinc-300 hover:text-zinc-600 transition-colors" 
                                data-verify-id="${trackId}"
                                title="Verify across Knowledge Graphs">
                            <i data-lucide="shield-check" class="w-4 h-4"></i>
                        </button>
                        <button class="play-btn p-2 text-zinc-300 hover:text-zinc-900 transition-colors" data-url="${track.previewUrl}">
                            <i data-lucide="play" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                
                div.querySelector('.verify-btn').onclick = () => verifySongData(track.trackName, track.artistName, trackId);
                tracksContainer.appendChild(div);
            });

            document.querySelectorAll('.play-btn').forEach(btn => {
                btn.onclick = function() {
                    const url = this.getAttribute('data-url');
                    this.parentElement.innerHTML = `
                        <audio autoplay controls class="h-8 w-32 md:w-48 grayscale opacity-80">
                            <source src="${url}" type="audio/mpeg">
                        </audio>
                    `;
                };
            });

            lucide.createIcons();
        }

        backButton.onclick = () => {
            detailView.classList.add('hidden');
            searchView.classList.remove('hidden');
            window.scrollTo(0, 0);
        };
    </script>
</body>
</html>
