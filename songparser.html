<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Index SEO Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drop-zone { border: 2px dashed #cbd5e1; transition: all 0.3s; }
        .drop-zone.active { border-color: #3b82f6; background: #eff6ff; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg p-8">
        <header class="mb-8 text-center">
            <h1 class="text-2xl font-bold text-slate-800">SEO Index Generator</h1>
            <p class="text-slate-500 mt-2">Upload your index.html to generate a crawlable song archive.</p>
        </header>

        <div id="dropZone" class="drop-zone rounded-lg p-12 text-center cursor-pointer mb-6">
            <div id="idleState">
                <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p class="mt-4 text-sm text-slate-600">Click to upload or drag <b>index.html</b> here</p>
            </div>
            <div id="loadingState" class="hidden">
                <p class="text-blue-600 font-medium animate-pulse">Parsing Song Data...</p>
            </div>
        </div>

        <input type="file" id="fileInput" class="hidden" accept=".html">

        <div id="resultArea" class="hidden space-y-4">
            <div class="bg-green-50 border border-green-200 rounded-lg p-4 flex items-center justify-between">
                <div>
                    <p class="text-green-800 font-semibold" id="countLabel">0 Songs Found</p>
                    <p class="text-xs text-green-600">Ready to generate all-songs.html</p>
                </div>
                <button id="downloadBtn" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-medium transition shadow-md">
                    Download File
                </button>
            </div>
            
            <div class="text-xs text-slate-400 italic">
                Note: The output includes visible track details and hidden JSON-LD for Google Search indexing.
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const resultArea = document.getElementById('resultArea');
        const countLabel = document.getElementById('countLabel');
        const downloadBtn = document.getElementById('downloadBtn');
        let extractedData = null;

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('active'); };
        dropZone.ondragleave = () => dropZone.classList.remove('active');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            handleFile(e.dataTransfer.files[0]);
        };
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => parseHTML(e.target.result);
            reader.readAsText(file);
        }

        function parseHTML(htmlString) {
            try {
                // Regex matches the songData object inside index.html
                const match = htmlString.match(/const\s+songData\s*=\s*({[\s\S]*?});/);
                
                if (!match) {
                    alert("Could not find 'const songData' in the file.");
                    return;
                }

                // Eval used to parse the JS object literal into a real JS object
                extractedData = eval('(' + match[1] + ')');
                
                const allSongsCount = Object.values(extractedData).flat().length;
                countLabel.innerText = `${allSongsCount} Songs Detected`;
                resultArea.classList.remove('hidden');
                dropZone.classList.add('opacity-50', 'pointer-events-none');
            } catch (err) {
                console.error(err);
                alert("Error parsing file. Ensure songData is formatted correctly.");
            }
        }

        downloadBtn.onclick = () => {
            if (!extractedData) return;

            // Map the object entries so we keep the Key (Year) and the Value (Song List)
            const flattenedSongs = Object.entries(extractedData).flatMap(([year, list]) => 
                list.map(s => ({
                    year: year,
                    artist: s.artist,
                    track: s.track, // Using .track from your source
                    genre: s.genre
                }))
            );
            
            // Build the Structured Data (Schema.org)
            const jsonLd = {
                "@context": "https://schema.org",
                "@type": "ItemList",
                "name": "Complete 1000 Songs Archive",
                "itemListElement": flattenedSongs.map((s, i) => ({
                    "@type": "ListItem",
                    "position": i + 1,
                    "item": {
                        "@type": "MusicRecording",
                        "name": s.track,
                        "byArtist": { "@type": "MusicGroup", "name": s.artist },
                        "datePublished": s.year,
                        "genre": s.genre
                    }
                }))
            };

            const htmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Song Archive | 1000 Songs Index (1930-2030)</title>
    <meta name="description" content="Chronological archive of 1000 songs spanning a century of music.">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; color: #1a1a1a; max-width: 900px; margin: 0 auto; padding: 40px 20px; background: #fff; }
        .back-link { text-decoration: none; color: #0066ff; font-weight: 500; display: inline-block; margin-bottom: 30px; }
        h1 { font-size: 2.5rem; letter-spacing: -0.02em; margin-bottom: 10px; }
        .meta-info { color: #666; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        
        .song-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .song-table th { text-align: left; padding: 12px 8px; border-bottom: 2px solid #000; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .song-table td { padding: 12px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: baseline; }
        
        .col-year { width: 80px; color: #999; font-family: tabular-nums; }
        .col-track { font-weight: 600; }
        .col-artist { color: #444; }
        .col-genre { color: #888; font-size: 0.85rem; text-align: right; }

        @media (max-width: 600px) {
            .col-genre { display: none; }
            h1 { font-size: 1.8rem; }
        }
    </style>
    <script type="application/ld+json">
        ${JSON.stringify(jsonLd)}
    <\/script>
</head>
<body>
    <a href="index.html" class="back-link">← Return to Interactive Index</a>
    <h1>Complete Song Archive</h1>
    <p class="meta-info">Total Tracks: ${flattenedSongs.length} • Spanning 1930 — 2030</p>
    
    <table class="song-table">
        <thead>
            <tr>
                <th>Year</th>
                <th>Track</th>
                <th>Artist</th>
                <th style="text-align:right">Genre</th>
            </tr>
        </thead>
        <tbody>
            ${flattenedSongs.map(s => `
            <tr>
                <td class="col-year">${s.year}</td>
                <td class="col-track">${s.track}</td>
                <td class="col-artist">${s.artist}</td>
                <td class="col-genre">${s.genre}</td>
            </tr>`).join('')}
        </tbody>
    </table>

    <footer style="margin-top: 80px; padding-top: 20px; border-top: 1px solid #eee; color: #aaa; font-size: 0.8rem;">
        Generated for SEO and Accessibility. All metadata extracted from core index.
    </footer>
</body>
</html>`;

            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'all-songs.html';
            a.click();
            URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
