<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drafting Table | GIF Maker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --subtle: #888888;
            --line: #eeeeee;
            --accent: #0066ff;
            --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
            --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        [data-theme="dark"] {
            --bg: #0a0a0a;
            --text: #ffffff;
            --subtle: #222222;
            --line: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        header {
            padding: 1.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--text);
            background: var(--bg);
            z-index: 1000;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .toolbar {
            display: flex;
            gap: 1.5rem;
        }

        .tool-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text);
            opacity: 0.6;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .tool-btn:hover { opacity: 1; }
        .tool-btn.primary { color: var(--accent); opacity: 1; }

        .app-container {
            flex: 1;
            display: grid;
            grid-template-columns: 380px 1fr;
            height: calc(100vh - 75px);
        }

        aside {
            border-right: 1px solid var(--line);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--subtle);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slide-card {
            background: var(--bg);
            border: 1px solid var(--line);
            padding: 1rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .slide-card input, .slide-card textarea, .slide-card select {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--line);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.8rem;
            padding: 0.5rem 0;
            margin-bottom: 0.5rem;
            outline: none;
        }

        .slide-card textarea {
            font-family: var(--font);
            font-weight: 800;
            text-transform: uppercase;
            height: 60px;
        }

        .row { display: flex; gap: 0.5rem; align-items: center; }

        .image-upload-btn {
            font-size: 0.6rem;
            text-decoration: underline;
            cursor: pointer;
            color: var(--subtle);
        }

        .remove-slide {
            font-size: 0.6rem;
            color: #ff4444;
            cursor: pointer;
            text-transform: uppercase;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f4f4f4;
            position: relative;
        }

        [data-theme="dark"] main { background: #111; }

        .preview-canvas-container {
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            background: white;
            line-height: 0;
            border: 1px solid var(--line);
        }

        #preview-canvas {
            max-width: 100%;
            height: auto;
        }

        .resolution-info {
            position: absolute;
            bottom: 2rem;
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--subtle);
            text-transform: uppercase;
        }

        #toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--text);
            color: var(--bg);
            padding: 1rem 2rem;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transform: translateY(200%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
        }
        #toast.visible { transform: translateY(0); }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            color: white;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .loading-overlay.visible { display: flex; }
    </style>
</head>
<body>

<header>
    <div class="brand">DRAFTING TABLE / GIF MAKER.</div>
    <div class="toolbar">
        <button class="tool-btn primary" onclick="renderGif()">Export GIF</button>
        <button class="tool-btn" onclick="addSlide()">+ Add Frame</button>
        <button class="tool-btn" onclick="toggleTheme()">Theme</button>
    </div>
</header>

<div class="app-container">
    <aside id="controls">
        <div>
            <div class="section-title">Global Config</div>
            <div class="slide-card">
                <div class="row">
                    <input type="number" id="gif-width" value="600" placeholder="Width">
                    <span style="font-size: 0.7rem; color: var(--subtle)">×</span>
                    <input type="number" id="gif-height" value="600" placeholder="Height">
                </div>
            </div>
        </div>

        <div id="slides-container">
            <div class="section-title">Timeline</div>
            <!-- Slides injected here -->
        </div>
    </aside>

    <main>
        <div class="preview-canvas-container">
            <canvas id="preview-canvas" width="600" height="600"></canvas>
        </div>
        <div class="resolution-info" id="res-info">600 x 600 px • Preview Mode</div>
    </main>
</div>

<div id="toast">GIF Ready</div>
<div class="loading-overlay" id="loader">
    <div class="brand">Processing Frames</div>
    <div id="progress" style="font-family: var(--mono); font-size: 0.8rem; margin-top: 10px;">0%</div>
</div>

<script>
    const slidesContainer = document.getElementById('slides-container');
    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');
    const widthInput = document.getElementById('gif-width');
    const heightInput = document.getElementById('gif-height');
    const resInfo = document.getElementById('res-info');

    let slides = [
        { text: 'NEW PROJECT', duration: 800, bgColor: '#0066ff', textColor: '#ffffff', fontSize: 40, image: null },
    ];

    let currentPreviewIndex = 0;
    let previewTimer = null;

    function init() {
        renderSlideControls();
        startPreview();
        
        widthInput.addEventListener('input', updateCanvasSize);
        heightInput.addEventListener('input', updateCanvasSize);
    }

    function updateCanvasSize() {
        canvas.width = parseInt(widthInput.value) || 600;
        canvas.height = parseInt(heightInput.value) || 600;
        resInfo.innerText = `${canvas.width} x ${canvas.height} px • Preview Mode`;
    }

    function renderSlideControls() {
        const title = '<div class="section-title">Timeline</div>';
        slidesContainer.innerHTML = title;
        
        slides.forEach((slide, index) => {
            const div = document.createElement('div');
            div.className = 'slide-card';
            div.innerHTML = `
                <div class="row" style="justify-content: space-between; margin-bottom: 10px;">
                    <span style="font-size: 0.6rem; font-weight: bold; font-family: var(--mono)">FRAME ${index + 1}</span>
                    <span class="remove-slide" onclick="removeSlide(${index})">Remove</span>
                </div>
                
                <textarea placeholder="Overlay Text" oninput="updateSlide(${index}, 'text', this.value)">${slide.text}</textarea>
                
                <div class="row">
                    <div style="flex:1">
                        <label class="image-upload-btn">
                            ${slide.image ? 'Change Image' : 'Upload Image'}
                            <input type="file" style="display:none" accept="image/*" onchange="handleImageUpload(${index}, this)">
                        </label>
                    </div>
                    <div style="display:flex; gap: 4px; align-items:center;">
                        <span style="font-size: 0.5rem; color: var(--subtle)">MS:</span>
                        <input type="number" style="width: 50px;" value="${slide.duration}" oninput="updateSlide(${index}, 'duration', this.value)">
                    </div>
                </div>

                <div class="row" style="margin-top: 5px;">
                    <input type="color" value="${slide.bgColor}" oninput="updateSlide(${index}, 'bgColor', this.value)" title="BG Color">
                    <input type="color" value="${slide.textColor}" oninput="updateSlide(${index}, 'textColor', this.value)" title="Text Color">
                    <input type="number" value="${slide.fontSize}" style="width: 50px;" oninput="updateSlide(${index}, 'fontSize', this.value)" title="Font Size">
                </div>
            `;
            slidesContainer.appendChild(div);
        });
    }

    function handleImageUpload(index, input) {
        const file = input.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                slides[index].image = img;
                renderSlideControls();
                showToast('Image Attached');
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function addSlide() {
        slides.push({
            text: 'EDIT TEXT',
            duration: 500,
            bgColor: '#ffffff',
            textColor: '#000000',
            fontSize: 40,
            image: null
        });
        renderSlideControls();
    }

    function removeSlide(index) {
        if (slides.length <= 1) return;
        slides.splice(index, 1);
        renderSlideControls();
        currentPreviewIndex = 0;
    }

    function updateSlide(index, key, value) {
        slides[index][key] = (key === 'duration' || key === 'fontSize') ? parseInt(value) : value;
    }

    function drawFrame(ctx, slide, w, h) {
        // Background
        ctx.fillStyle = slide.bgColor;
        ctx.fillRect(0, 0, w, h);
        
        // Image
        if (slide.image) {
            // Center Crop/Cover logic
            const img = slide.image;
            const imgRatio = img.width / img.height;
            const canvasRatio = w / h;
            let drawW, drawH, drawX, drawY;

            if (imgRatio > canvasRatio) {
                drawH = h;
                drawW = h * imgRatio;
                drawX = (w - drawW) / 2;
                drawY = 0;
            } else {
                drawW = w;
                drawH = w / imgRatio;
                drawX = 0;
                drawY = (h - drawH) / 2;
            }
            ctx.drawImage(img, drawX, drawY, drawW, drawH);
        }
        
        // Text Overlay - Using the Drafting Table font
        if (slide.text) {
            ctx.fillStyle = slide.textColor;
            // Bold sans-serif for that specific brand look
            ctx.font = `800 ${slide.fontSize}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.letterSpacing = "-0.02em"; // Match brand feel
            
            const lines = slide.text.split('\n');
            const lineHeight = slide.fontSize * 1.1;
            const totalHeight = lines.length * lineHeight;
            let currentY = (h / 2) - (totalHeight / 2) + (lineHeight / 2);
            
            lines.forEach((line) => {
                ctx.fillText(line.toUpperCase(), w / 2, currentY);
                currentY += lineHeight;
            });
        }
    }

    function startPreview() {
        if (previewTimer) clearTimeout(previewTimer);
        
        const loop = () => {
            if (slides.length === 0) return;
            const slide = slides[currentPreviewIndex];
            drawFrame(ctx, slide, canvas.width, canvas.height);
            
            previewTimer = setTimeout(() => {
                currentPreviewIndex = (currentPreviewIndex + 1) % slides.length;
                loop();
            }, Math.max(slide.duration, 50));
        };
        
        loop();
    }

    async function renderGif() {
        const loader = document.getElementById('loader');
        const progress = document.getElementById('progress');
        loader.classList.add('visible');

        // FIX: Fetch the worker script as a Blob to bypass Cross-Origin restrictions
        let workerUrl = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
        try {
            const response = await fetch(workerUrl);
            const scriptText = await response.text();
            const blob = new Blob([scriptText], { type: 'application/javascript' });
            workerUrl = URL.createObjectURL(blob);
        } catch (error) {
            console.error("Failed to load worker script:", error);
            showToast('Error: Could not load GIF worker');
            loader.classList.remove('visible');
            return;
        }

        const gif = new GIF({
            workers: 4,
            quality: 10,
            width: canvas.width,
            height: canvas.height,
            workerScript: workerUrl // Use the generated Blob URL here
        });

        slides.forEach(slide => {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            
            drawFrame(tempCtx, slide, tempCanvas.width, tempCanvas.height);
            gif.addFrame(tempCtx, {copy: true, delay: slide.duration});
        });

        gif.on('progress', p => {
            progress.innerText = Math.round(p * 100) + '%';
        });

        gif.on('finished', blob => {
            loader.classList.remove('visible');
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `drafting_table_${Date.now()}.gif`;
            a.click();
            showToast('GIF Exported');
            
            // Clean up the worker blob URL from memory
            URL.revokeObjectURL(workerUrl); 
        });

        gif.render();
    }

    function toggleTheme() {
        const current = document.body.getAttribute('data-theme');
        document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('visible');
        setTimeout(() => toast.classList.remove('visible'), 3000);
    }

    window.onload = init;
</script>
</body>
</html>
