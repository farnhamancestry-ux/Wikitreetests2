<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Album Previewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Styling the native audio player to be more minimalist */
        audio::-webkit-media-controls-enclosure {
            border-radius: 4px;
            background-color: #f4f4f5;
        }
        
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #18181b;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-white text-zinc-900 antialiased">

    <div class="max-w-2xl mx-auto px-6 py-12 md:py-20">
        
        <!-- Search Header Section -->
        <div id="search-view">
            <header class="mb-12">
                <h1 class="text-4xl font-light tracking-tighter mb-2">Discography</h1>
                <p class="text-[10px] text-zinc-400 uppercase tracking-[0.2em] font-medium">Search the iTunes Archive</p>
            </header>

            <form id="search-form" class="relative mb-12">
                <input 
                    type="text" 
                    id="search-input"
                    placeholder="Search artist or album..." 
                    class="w-full border-b border-zinc-200 py-4 pl-0 pr-10 focus:outline-none focus:border-zinc-900 transition-all text-xl font-light placeholder:text-zinc-200"
                    required
                >
                <button type="submit" class="absolute right-0 top-1/2 -translate-y-1/2 p-2 text-zinc-400 hover:text-zinc-900 transition-colors">
                    <i id="search-icon" data-lucide="search" class="w-6 h-6"></i>
                    <div id="search-loader" class="loader hidden"></div>
                </button>
            </form>

            <div id="results-container" class="space-y-px bg-zinc-100 border border-zinc-100 overflow-hidden rounded-sm hidden">
                <!-- Albums will be injected here -->
            </div>

            <div id="empty-state" class="py-20 text-center opacity-10">
                <i data-lucide="disc" class="w-16 h-16 mx-auto mb-4 stroke-[1px]"></i>
                <p class="text-sm font-light">Type to explore</p>
            </div>
        </div>

        <!-- Track Detail Section (Hidden by default) -->
        <div id="detail-view" class="hidden">
            <button id="back-button" class="flex items-center gap-2 text-zinc-400 hover:text-zinc-900 mb-10 transition-colors text-[10px] uppercase tracking-widest font-bold">
                <i data-lucide="chevron-left" class="w-4 h-4"></i> Back to results
            </button>

            <div id="album-header" class="mb-12">
                <!-- Album metadata injected here -->
            </div>

            <div id="tracks-container" class="space-y-0 border-t border-zinc-100">
                <!-- Tracks injected here -->
            </div>
        </div>

    </div>

    <script>
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const resultsContainer = document.getElementById('results-container');
        const emptyState = document.getElementById('empty-state');
        const searchView = document.getElementById('search-view');
        const detailView = document.getElementById('detail-view');
        const albumHeader = document.getElementById('album-header');
        const tracksContainer = document.getElementById('tracks-container');
        const backButton = document.getElementById('back-button');
        const searchIcon = document.getElementById('search-icon');
        const searchLoader = document.getElementById('search-loader');

        // Initialize icons
        lucide.createIcons();

        function toggleLoading(isLoading) {
            if (isLoading) {
                searchIcon.classList.add('hidden');
                searchLoader.classList.remove('hidden');
            } else {
                searchIcon.classList.remove('hidden');
                searchLoader.classList.add('hidden');
            }
        }

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (!query) return;

            toggleLoading(true);

            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=album&limit=20`);
                const data = await response.json();
                renderAlbums(data.results);
            } catch (error) {
                console.error('Search error:', error);
            } finally {
                toggleLoading(false);
            }
        });

        function renderAlbums(albums) {
            resultsContainer.innerHTML = '';
            
            if (albums.length === 0) {
                emptyState.classList.remove('hidden');
                resultsContainer.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            resultsContainer.classList.remove('hidden');

            albums.forEach(album => {
                const button = document.createElement('button');
                button.className = 'w-full text-left bg-white p-6 hover:bg-zinc-50 transition-colors flex justify-between items-center group fade-in';
                button.innerHTML = `
                    <div class="pr-4">
                        <h3 class="text-sm font-medium leading-tight mb-1">${album.collectionName}</h3>
                        <p class="text-xs text-zinc-400">${album.artistName}</p>
                    </div>
                    <i data-lucide="arrow-right" class="w-4 h-4 text-zinc-200 group-hover:text-zinc-900 transition-colors shrink-0"></i>
                `;
                button.onclick = () => fetchTracks(album);
                resultsContainer.appendChild(button);
            });
            lucide.createIcons();
        }

        async function fetchTracks(album) {
            toggleLoading(true);
            try {
                const response = await fetch(`https://itunes.apple.com/lookup?id=${album.collectionId}&entity=song`);
                const data = await response.json();
                const tracks = data.results.filter(item => item.wrapperType === 'track');
                
                renderTracks(album, tracks);
            } catch (error) {
                console.error('Track fetch error:', error);
            } finally {
                toggleLoading(false);
            }
        }

        function renderTracks(album, tracks) {
            // Switch views
            searchView.classList.add('hidden');
            detailView.classList.remove('hidden');
            window.scrollTo(0, 0);

            // Album Info
            albumHeader.innerHTML = `
                <h2 class="text-3xl font-light mb-1 leading-tight">${album.collectionName}</h2>
                <p class="text-sm text-zinc-500">${album.artistName}</p>
                <div class="h-[2px] w-8 bg-zinc-900 mt-6"></div>
            `;

            // Tracks
            tracksContainer.innerHTML = '';
            tracks.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-4 py-5 border-b border-zinc-50 transition-all fade-in';
                div.style.animationDelay = `${index * 0.05}s`;
                
                div.innerHTML = `
                    <span class="text-[10px] text-zinc-300 tabular-nums w-4 shrink-0 font-medium">
                        ${String(index + 1).padStart(2, '0')}
                    </span>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-normal truncate pr-2">${track.trackName}</p>
                    </div>
                    <div class="shrink-0 flex items-center justify-end min-w-[40px]">
                        <button class="play-btn p-2 text-zinc-300 hover:text-zinc-900 transition-colors" data-url="${track.previewUrl}">
                            <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                        </button>
                    </div>
                `;
                tracksContainer.appendChild(div);
            });

            // Handle Track Playback
            document.querySelectorAll('.play-btn').forEach(btn => {
                btn.onclick = function() {
                    const url = this.getAttribute('data-url');
                    const parent = this.parentElement;
                    
                    // Reset all other buttons in this view if needed (optional)
                    // For simplicity, we just swap the clicked button for a player
                    parent.innerHTML = `
                        <audio autoplay controls class="h-8 w-32 md:w-48 grayscale opacity-80">
                            <source src="${url}" type="audio/mpeg">
                        </audio>
                    `;
                };
            });

            lucide.createIcons();
        }

        backButton.onclick = () => {
            detailView.classList.add('hidden');
            searchView.classList.remove('hidden');
            window.scrollTo(0, 0);
        };
    </script>
</body>
</html>
